name: CI

# Complements deploy.yml's own test gate: this runs on every PR (deploy.yml
# only fires on push to main) and adds coverage deploy.yml doesn't have yet —
# the FastAPI/LSTM integration test and a Docker build check.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dashboard/data layer — no TensorFlow, runs on the plain requirements.txt.
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: python tests/integration_regression.py

  # FastAPI + LSTM layer — heavier deps (TensorFlow), separate requirements file.
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - run: pip install -r api/requirements.txt

      - run: python tests/api_integration.py

  # Make sure both images still build (catches Dockerfile/dependency breaks
  # before they reach the droplet). Images are built but not pushed anywhere.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app
          push: false

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
